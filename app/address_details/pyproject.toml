[project]
name = "chargepilot-address-module"
version = "0.1.0"
description = "FastAPI address details CRUD module for ChargePilot"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[tool.uv]
package = false
